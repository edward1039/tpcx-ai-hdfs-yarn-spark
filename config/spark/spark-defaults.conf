# Event logs for the Spark History Server (stage times, shuffle, spill, GC per application).
# Appended to $SPARK_HOME/conf/spark-defaults.conf by scripts/install_configs.sh.
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://localhost:9000/spark-logs
spark.history.fs.logDirectory    hdfs://localhost:9000/spark-logs
